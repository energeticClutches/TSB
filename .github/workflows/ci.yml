name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    # Pinned, not `ubuntu-latest`: the image moves to Ubuntu 26 on 19 Oct 2026 and a
    # build should not change under us without someone choosing it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs, not tags (Phase 8 §3.2): a tag can be moved to point at
      # new code, a SHA cannot. Bump these deliberately, keeping the version comment honest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests with coverage gate (pricing/token maths must stay at 100%)
        run: npx vitest run --coverage
        working-directory: packages/core
      - name: Database, security and API tests (real migrations in PGlite)
        run: npm test -w supabase
      - name: Dependency audit (fails on high-severity problems)
        run: npm audit --audit-level=high
      - name: "Builds (production settings: no demo code in the shipped apps)"
        run: npm run build
        env:
          VITE_DEMO: 'false'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - name: No demo database engine in the production admin build
        run: |
          if grep -rl "pglite" apps/admin/dist/assets >/dev/null 2>&1; then
            echo "PGlite leaked into the production admin build"; exit 1
          fi
