    <path d="M-18,-4 C-18,-20 -8,-28 0,-28 C8,-28 18,-20 18,-4 Z" fill="#FFE3F1"/>

  <text x="120" y="188" font-family="'Outfit', 'Fredoka', 'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#1A1118" text-anchor="middle" letter-spacing="6">BAR</text>
  
  <!-- Sub-label below -->
  <text x="120" y="208" font-family="sans-serif" font-weight="700" font-size="8.5" fill="#E6007A" text-anchor="middle" letter-spacing="1.5">ICE CREAM • SHAKES • SLUSH</text>
